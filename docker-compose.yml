services:
  postgres:
    image: postgres:16-alpine
    container_name: mundiwms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mundiwms
    ports:
      - "5433:5432"
    volumes:
      - mundiwms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mundiwms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mundiwms_postgres_data:
